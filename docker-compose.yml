services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sekurity}
      POSTGRES_USER: ${POSTGRES_USER:-sekurity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  backend:
    build:
      context: ./seKUrity_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sekurity}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-sekurity}
      INTERNAL_API_TOKEN: ${BACKEND_INTERNAL_TOKEN:?BACKEND_INTERNAL_TOKEN is required}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 127.0.0.1:${BACKEND_PORT:-3000}:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app
      - data

  web:
    build:
      context: ./seKUrity_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edge

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTBOT_HOST_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/nginx-health
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edge

  bot:
    build:
      context: ./seKUrity_bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      BACKEND_API_URL: http://backend:3000
      BACKEND_API_TOKEN: ${BACKEND_INTERNAL_TOKEN:?BACKEND_INTERNAL_TOKEN is required}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - bot-data:/app/data
    networks:
      - app

volumes:
  postgres-data:
  bot-data:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
