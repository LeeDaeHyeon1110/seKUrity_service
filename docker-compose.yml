services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sekurity}
      POSTGRES_USER: ${POSTGRES_USER:-sekurity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  backend:
    build:
      context: ./seKUrity_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sekurity}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-sekurity}
      INTERNAL_API_TOKEN: ${BACKEND_INTERNAL_TOKEN:?BACKEND_INTERNAL_TOKEN is required}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-https://sekurity.kr/api/v1/auth/discord/callback}
      WEB_AUTH_GUILD_ID: ${WEB_AUTH_GUILD_ID:-1507335622719967292}
      WEB_ACTIVE_MEMBER_ROLE_ID: ${WEB_ACTIVE_MEMBER_ROLE_ID:-1507362589619912734}
      WEB_BOARD_MEMBER_ROLE_ID: ${WEB_BOARD_MEMBER_ROLE_ID:-1507362663339135047}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER:?SESSION_TOKEN_PEPPER is required}
      SITE_URL: ${SITE_URL:-https://sekurity.kr}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/profile-photos}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 127.0.0.1:${BACKEND_PORT:-3000}:3000
    volumes:
      - backend-uploads:${UPLOAD_DIR:-/app/data/profile-photos}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - app
      - data

  web:
    build:
      context: ./seKUrity_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SITE_URL: ${SITE_URL:-https://sekurity.kr}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edge

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTBOT_HOST_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/nginx-health
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edge

  bot:
    build:
      context: ./seKUrity_bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      WEB_AUTH_GUILD_ID: ${WEB_AUTH_GUILD_ID:-1507335622719967292}
      BACKEND_API_URL: http://backend:3000
      BACKEND_API_TOKEN: ${BACKEND_INTERNAL_TOKEN:?BACKEND_INTERNAL_TOKEN is required}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - bot-data:/app/data
    networks:
      - app

volumes:
  postgres-data:
  backend-uploads:
  bot-data:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
