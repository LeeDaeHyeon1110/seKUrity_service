services:
  backend:
    environment:
      NODE_ENV: development
      SITE_URL: http://127.0.0.1:8080
      DISCORD_REDIRECT_URI: http://127.0.0.1:8080/api/v1/auth/discord/callback
    ports: !override []

  web:
    environment:
      SITE_URL: http://127.0.0.1:8080

  nginx:
    ports: !override
      - 127.0.0.1:8080:80
    volumes: !override
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro

  bot:
    profiles:
      - bot
